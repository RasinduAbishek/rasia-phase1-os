<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RASIA // PHASE 1 SUPER OS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="login" class="login-screen">
  <div class="orb orb1"></div><div class="orb orb2"></div>
  <div class="login-card">
    <div class="mark">R<span>/</span>1</div>
    <div class="tiny">PRIVATE PERSONAL OPERATING SYSTEM</div>
    <h1>RASIA<br><em>MASTER PLAN</em></h1>
    <p>PHASE 1 · 14 SEP — 31 DEC 2026</p>
    <input id="loginUser" autocomplete="username" placeholder="Username">
    <input id="loginPass" type="password" autocomplete="current-password" placeholder="Password">
    <button id="loginBtn" class="glow-btn">ENTER SYSTEM <span>→</span></button>
    <div id="loginMsg"></div>
  </div>
</div>

<div id="app" class="hidden">
<header class="topbar">
  <button id="mobileMenu" class="icon-btn">☰</button>
  <div class="top-title"><span class="live-dot"></span> RASIA / P1 <small id="clock"></small></div>
  <div class="top-right"><span id="phaseProgress"></span><button id="logout" class="icon-btn">⎋</button></div>
</header>

<aside id="side">
  <div class="brand">RASIA<span>//</span><small>MASTER PLAN OS</small></div>
  <div class="navgroup">
    <button data-page="dashboard">⌂ <span>Dashboard</span></button>
    <button data-page="calendar">▦ <span>Calendar</span></button>
    <button data-page="daily">◷ <span>Daily</span></button>
    <button data-page="weekly">▤ <span>Weekly</span></button>
    <button data-page="monthly">◫ <span>Monthly</span></button>
    <button data-page="free">∞ <span>Free Time</span></button>
    <button data-page="study">✦ <span>Study OS</span></button>
    <button data-page="goals">◎ <span>Goals</span></button>
    <button data-page="reminders">⏰ <span>Reminders</span></button>
    <button data-page="changes">↻ <span>Changes</span></button>
    <button data-page="ai">✧ <span>Rasia AI</span><b class="ai-dot">AI</b></button>
  </div>
  <div class="side-bottom"><div class="mini">PHASE 1</div><div class="progress"><i id="sideProg"></i></div><small id="sideDays"></small></div>
</aside>

<main id="main"></main>
<div id="toast"></div>
</div>
<script src="js/app.js"></script>
</body>
</html>
